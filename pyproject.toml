[project]
name = "odd-dbt"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "1cadumagalhaes", email = "github@cadumagalhaes.dev" }]
requires-python = ">=3.12"
dependencies = [
    "dbt-bigquery>=1.9.1",
    "funcy>=2.0",
    "loguru>=0.7.3",
    "odd-models>=2.0.51",
    "oddrn-generator>=0.1.103",
    "psycopg2-binary>=2.9.10",
    "sqlalchemy>=2.0.41",
    "typer>=0.15.4",
]

[project.scripts]
odd-dbt = "odd_dbt:main"

[build-system]
requires = ["uv_build>=0.7.4,<0.8"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pre-commit>=4.2.0", "pytest>=8.3.5", "ruff>=0.11.10"]

[tool.ruff]
ignore = ["E501"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"logger.py" = ["F401"]
