[project]
name = "odd-dbt"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "1cadumagalhaes", email = "github@cadumagalhaes.dev" },
    { name = "Mateusz Kulas", email = "mkulas@provectus.com>" },
]
requires-python = ">=3.12"
dependencies = [
    "dbt-bigquery>=1.9.1",
    "dbt-postgres>=1.9.0",
    "dbt-snowflake>=1.9.4",
    "funcy>=2.0",
    "loguru>=0.7.3",
    "odd-models>=2.0.51",
    "oddrn-generator>=0.1.103",
    "psycopg2-binary>=2.9.10",
    "sqlalchemy>=2.0.41",
    "typer>=0.15.4",
]

[project.scripts]
odd-dbt = "odd_dbt:main"
inspect-dbt = "odd_dbt.inspect_dbt_project:app"

[build-system]
requires = ["uv_build>=0.7.4,<0.8"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pre-commit>=4.2.0", "pytest>=8.3.5", "ruff>=0.11.10"]

[tool.ruff]
# Same as Black.
line-length = 88
indent-width = 4
target-version = "py312"

# Allow imports relative to the "src" and "tests" directories.
src = ["odd_dbt", "tests"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"logger.py" = ["F401"]


[tool.uv.build-backend]
module-root = "."

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B"]
fixable = ["ALL"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
indent-style = "space"

docstring-code-line-length = "dynamic"
